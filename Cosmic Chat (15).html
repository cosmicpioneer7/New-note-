<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<meta name="theme-color" content="#0b1014">
<title>Cosmic Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0b1014;
  --panel: #161d24;
  --field: #202930;
  --line: rgba(255,255,255,.07);
  --text: #e9edef;
  --muted: #8696a0;
  --grad: #1d5fae;
  --accent: #53a6fa;
  --onaccent: #fff;
  --danger: #ff7a90;
  --read: #53bdeb;
  --chip: rgba(83,166,250,.16);
}
:root[data-theme=light] {
  color-scheme: light;
  --bg: #f4f6fb;
  --panel: #ffffff;
  --field: #e8ecf6;
  --line: rgba(0,0,0,.08);
  --text: #161a2b;
  --muted: #5f6784;
  --grad: #4a6fa5;
  --accent: #3d5f94;
  --onaccent: #fff;
  --read: #2f6fb5;
  --chip: rgba(61,95,148,.12);
}
* {
  box-sizing: border-box;
  scrollbar-width: thin;
  scrollbar-color: rgba(138,150,166,.35) transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
input, textarea {
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}
input::selection, textarea::selection {
  background: rgba(83,166,250,.35);
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  overscroll-behavior: none;
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
  font: 16px/1.4 'Outfit', system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
}
*, button, .tab, .chip, .row, .fab, .chead-pill, .av-tap, .ppop-hero {
  -webkit-tap-highlight-color: transparent;
}
[hidden] {
  display: none !important;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Main App Container */
.app {
  --lw: 340px;
  position: relative;
  max-width: 560px;
  width: 100%;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
@media (min-width: 720px) {
  .app {
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
}
.hd {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 0 18px;
}
.hd h1, .card h1 {
  font-family: 'Space Grotesk', 'Outfit', system-ui, sans-serif;
  font-weight: 600;
  letter-spacing: -.3px;
  color: #5aa9ff;
}
:root[data-theme=light] .hd h1, :root[data-theme=light] .card h1 {
  color: #1d6fd6;
}
.hd h1 {
  flex: 1;
  margin: 0;
  font-size: 24px;
}
.ib {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--text);
  flex: none;
  transition: transform .18s cubic-bezier(.22, 1.35, .36, 1), background-color .18s ease;
}
.hd .ib {
  width: 40px;
  height: 40px;
}
.ib:active {
  background: var(--panel);
  transform: scale(.91);
}
.ic {
  display: inline-flex;
}
.search {
  flex: 0 0 auto;
  margin: 8px 16px 6px;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 14px 0 16px;
  border-radius: 999px;
  background: var(--field);
  border: 1px solid var(--line);
  color: var(--muted);
  transition: box-shadow .2s ease, border-color .2s ease, background-color .2s ease;
}
.search:focus-within {
  border-color: rgba(83, 166, 250, .45);
  box-shadow: 0 0 0 3px rgba(83, 166, 250, .14);
}
.search #sico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  color: var(--muted);
  transition: color .2s ease;
}
.search:focus-within #sico {
  color: var(--accent);
}
.search input {
  flex: 1;
  min-width: 0;
  height: 100%;
  background: none;
  border: 0;
  outline: 0;
  font-size: 15.5px;
  line-height: 1.2;
  color: var(--text);
  text-overflow: ellipsis;
}
.search input::placeholder {
  color: var(--muted);
}
.search .sclr {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
  background: rgba(255, 255, 255, .08);
  color: var(--muted);
  font-size: 16px;
  line-height: 1;
}
:root[data-theme=light] .search .sclr {
  background: rgba(0, 0, 0, .07);
}
.search .sclr:active {
  transform: scale(.9);
}
.chip {
  padding: 8px 18px;
  border-radius: 99px;
  border: 1px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
  flex: none;
  transition: transform .18s cubic-bezier(.22, 1.35, .36, 1), background-color .2s, color .2s;
}
.chip:active {
  transform: scale(.93);
}
.chip.on {
  background: var(--chip);
  border-color: transparent;
  color: var(--accent);
}
#view {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 112px;
  overscroll-behavior: contain;
  touch-action: pan-y;
  will-change: transform, opacity;
}
#view.slide-l {
  animation: tabSlideL .24s cubic-bezier(.22, .85, .32, 1) both;
}
#view.slide-r {
  animation: tabSlideR .24s cubic-bezier(.22, .85, .32, 1) both;
}
@keyframes tabSlideL {
  from { opacity: .35; transform: translateX(34px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes tabSlideR {
  from { opacity: .35; transform: translateX(-34px); }
  to { opacity: 1; transform: translateX(0); }
}
.row {
  display: flex;
  gap: 14px;
  align-items: center;
  width: 100%;
  min-width: 0;
  text-align: left;
  padding: 12px 18px;
  transition: transform .2s cubic-bezier(.22, 1.35, .36, 1), background-color .16s ease;
}
button.row:active {
  background: var(--panel);
  --av-cutout: var(--panel);
  transform: scale(.985);
}
.g {
  flex: 1;
  min-width: 0;
}
.g b {
  font-weight: 500;
  font-size: 17px;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sub {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pcard.list .row .sub,
.sheet .row .sub {
  display: block;
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  overflow-wrap: anywhere;
  line-height: 1.32;
  margin-top: 2px;
}
small {
  color: var(--muted);
  font-size: 13px;
}
.rt {
  display: grid;
  justify-items: end;
  gap: 6px;
  color: var(--muted);
}
.rt.u small {
  color: #53a6fa;
}
:root[data-theme=light] .rt.u small {
  color: #1d6fd6;
}
.badge {
  background: #3b8ee8;
  color: #04121f;
  border-radius: 99px;
  font-size: 12px;
  min-width: 21px;
  height: 21px;
  display: grid;
  place-items: center;
  padding: 0 6px;
  font-weight: 600;
}
:root[data-theme=light] .badge,
:root[data-theme=light] .tp .badge {
  background: #1d6fd6;
  color: #ffffff;
}
.badge.mut {
  background: var(--muted);
  color: var(--bg);
}
.tk, .tick {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  color: var(--muted);
  flex: none;
  line-height: 0;
}
.tk svg, .tick svg {
  display: block;
  overflow: visible;
}
.tk.r, .tick.r {
  color: #53bdeb;
}
:root[data-theme=light] .tk.r,
:root[data-theme=light] .tick.r {
  color: #1d8cf8;
}
.sec {
  margin: 16px 18px 6px;
  color: var(--muted);
  font-size: 14px;
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 32px;
}
h2 {
  margin: 8px 18px 6px;
  font-size: 22px;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Avatars & Unclipped Online Status Indicator */
.av {
  --h: 200;
  --s: 56px;
  width: var(--s);
  height: var(--s);
  flex: none;
  border-radius: 50%;
  background: hsl(var(--h) 45% 17%);
  color: hsl(var(--h) 75% 74%);
  display: grid;
  place-items: center;
  font-weight: 500;
  font-size: calc(var(--s)/2.3);
  position: relative;
  overflow: visible;
  user-select: none;
}
.av > img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}
:root[data-theme=light] .av {
  background: hsl(var(--h) 45% 86%);
  color: hsl(var(--h) 55% 32%);
}
.av.on::after {
  content: "";
  position: absolute;
  right: calc(var(--s) * -0.02);
  bottom: calc(var(--s) * -0.02);
  width: clamp(10px, calc(var(--s) * 0.25), 16px);
  height: clamp(10px, calc(var(--s) * 0.25), 16px);
  border-radius: 50%;
  background: linear-gradient(145deg, #64b5ff, #2b8eff);
  border: clamp(2px, calc(var(--s) * 0.048), 3px) solid var(--av-cutout, var(--bg));
  box-sizing: border-box;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
  z-index: 2;
  pointer-events: none;
}
:root[data-theme=light] .av.on::after {
  background: linear-gradient(145deg, #3b95ff, #1d6fd6);
  box-shadow: 0 1px 3px rgba(29, 111, 214, .25);
}
.chead, .pcard, .sheet {
  --av-cutout: var(--panel);
}

.pill {
  padding: 8px 16px;
  border-radius: 99px;
  background: var(--grad);
  color: #fff;
  font-size: 15px;
  white-space: nowrap;
}
.row .pill {
  padding: 6px 12px;
  font-size: 14px;
}
.pill.alt {
  background: var(--field);
  color: var(--text);
}
.ac {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.field {
  width: 100%;
  padding: 12px 16px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--field);
  outline: 0;
}
.field:focus {
  border-color: var(--accent);
}

/* Single Floating Action Button & Icon-Only Floating Pill Navigation Bar */
.fab {
  position: absolute;
  right: 18px;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: linear-gradient(145deg, #2764ad, #1b4b87);
  border: 1px solid rgba(255, 255, 255, .14);
  color: #eef5ff;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 20px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .14);
  z-index: 4;
}
:root[data-theme=light] .fab {
  background: linear-gradient(145deg, #4b70a8, #3a5b8c);
  border-color: rgba(255, 255, 255, .24);
  color: #ffffff;
  box-shadow: 0 8px 18px rgba(22, 26, 43, .18);
}
.tabs {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  background: rgba(24, 33, 44, .92);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, .08);
  border-radius: 999px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .48);
  z-index: 4;
}
:root[data-theme=light] .tabs {
  background: rgba(255, 255, 255, 0.92);
  border-color: rgba(0, 0, 0, .08);
  box-shadow: 0 10px 28px rgba(22, 26, 43, .12);
}
.tab {
  flex: 1;
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  color: #93a3b1;
  border-radius: 999px;
}
.tab:focus, .tab:focus-visible {
  outline: none;
}
.tp {
  position: relative;
  width: 100%;
  height: 48px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .22s cubic-bezier(.22, 1.4, .36, 1), background-color .2s ease, color .2s ease;
}
.tab:active .tp {
  transform: scale(.93);
}
.tab.on {
  color: #3ea2ff;
}
.tab.on .tp {
  background: rgba(52, 132, 228, .2);
  color: #46a8ff;
}
:root[data-theme=light] .tab.on .tp {
  background: rgba(29, 111, 214, 0.14);
  color: #1d6fd6;
}
.tab:not(.on) .tp {
  color: #8b9aa7;
}
:root[data-theme=light] .tab:not(.on) .tp {
  color: #5f6784;
}
.tp .badge {
  position: absolute;
  top: 5px;
  left: calc(50% + 2px);
  min-width: 20px;
  height: 17px;
  padding: 0 5px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  background: #3ea2ff;
  color: #fff;
  border: 2px solid #18212c;
}
:root[data-theme=light] .tp .badge {
  border-color: #ffffff;
}
.tab-av {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  flex: none;
  border: 1.5px solid rgba(255, 255, 255, .22);
  transition: border-color .2s ease, transform .2s ease;
}
.tab.on .tab-av {
  border-color: #46a8ff;
}
:root[data-theme=light] .tab-av {
  border-color: rgba(0, 0, 0, .18);
}
:root[data-theme=light] .tab.on .tab-av {
  border-color: #1d6fd6;
}
.tab-av img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Conversation Panel - Strict Top-to-Bottom Flex Sequence */
.app.in .hd, .app.in .search, .app.in #view, .app.in .tabs, .app.in .fab {
  display: none;
}
.conv {
  position: absolute;
  inset: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 5;
  background: var(--wall, var(--bg));
}
.chead, .comp, .csbar, .pinbar, .rbar, .annote, .mpop, .emtray {
  position: relative;
  z-index: 3;
}
/* Progressive Blurry Edge Veils at Top & Bottom of Message Section */
.conv::before,
.conv::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  pointer-events: none;
  z-index: 2;
  transition: opacity .22s ease;
}
.conv::before {
  top: 0;
  height: calc(72px + env(safe-area-inset-top, 0px));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: transparent;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,.25) 75%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,.25) 75%, transparent 100%);
}
.conv::after {
  bottom: 0;
  height: calc(72px + env(safe-area-inset-bottom, 0px));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: transparent;
  -webkit-mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,.25) 75%, transparent 100%);
  mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,.25) 75%, transparent 100%);
}
.app.kb .conv::after,
.conv.has-tray::after {
  height: 70px;
}
.chead {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 8px;
  background: transparent;
  pointer-events: none;
}
.chead > * {
  pointer-events: auto;
}
#back,
.chead-pill,
#hx {
  background: rgba(22, 29, 36, .82);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 0;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .32);
  --av-cutout: #161d24;
}
:root[data-theme=light] #back,
:root[data-theme=light] .chead-pill,
:root[data-theme=light] #hx {
  background: rgba(255, 255, 255, .92);
  border: 0;
  box-shadow: 0 8px 24px rgba(22, 26, 43, .12);
  --av-cutout: #ffffff;
}
#back {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  flex: none;
}
.chead-pill {
  flex: 1 1 auto;
  min-width: 0;
  height: 46px;
  padding: 4px 16px 4px 5px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: transform .18s cubic-bezier(.22, 1.35, .36, 1), background-color .18s ease;
}
.chead-pill:focus,
.chead-pill:focus-visible,
.av-tap:focus,
.av-tap:focus-visible {
  outline: none;
}
.chead-pill:active {
  transform: scale(.98);
  background: rgba(34, 44, 54, .92);
}
:root[data-theme=light] .chead-pill:active {
  background: rgba(238, 242, 248, .96);
}
.chead-pill .g {
  flex: 1;
  min-width: 0;
  cursor: pointer;
}
.chead-pill .g b {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.2;
}
.chead-pill .sub {
  font-size: 12px;
  line-height: 1.2;
}
#hx {
  display: flex;
  flex: none;
  align-items: center;
  gap: 2px;
  height: 46px;
  padding: 0 5px;
  border-radius: 999px;
}
#hx .ib {
  width: 38px;
  height: 38px;
}
.pane {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: calc(68px + env(safe-area-inset-top, 0px)) 12px calc(68px + env(safe-area-inset-bottom, 0px));
  overscroll-behavior: contain;
  background-color: transparent;
  background-image: radial-gradient(circle at 20% 25%, rgba(83,166,250,.04) 0%, transparent 45%), radial-gradient(circle at 80% 75%, rgba(45,212,191,.04) 0%, transparent 45%);
  background-size: cover;
  background-position: center;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0px, rgba(0,0,0,.28) 26px, rgba(0,0,0,.88) 54px, #000 72px, #000 calc(100% - 72px), rgba(0,0,0,.88) calc(100% - 54px), rgba(0,0,0,.28) calc(100% - 26px), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0px, rgba(0,0,0,.28) 26px, rgba(0,0,0,.88) 54px, #000 72px, #000 calc(100% - 72px), rgba(0,0,0,.88) calc(100% - 54px), rgba(0,0,0,.28) calc(100% - 26px), transparent 100%);
}
.app.kb .pane {
  padding-bottom: 66px;
}

/* WhatsApp Message Rows & Sequence Grouping */
.mrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  position: relative;
  touch-action: pan-y;
}
.mrow.seq {
  margin-top: 2px;
}
.mrow.me {
  justify-content: flex-end;
}
.mrow::before {
  content: "\21A9";
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent);
  font-size: 22px;
  opacity: var(--sw, 0);
  pointer-events: none;
}
.mrow.arm::before {
  content: "\21a9";
  position: absolute;
  left: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--panel);
  display: grid;
  place-items: center;
  color: var(--accent);
  opacity: 1;
}

/* Sleek WhatsApp-style Bubbles */
.b {
  display: block;
  width: fit-content;
  max-width: 82%;
  padding: 6px 10px 7px;
  border-radius: 14px;
  background: #1f2c34;
  font-size: 15.5px;
  line-height: 1.38;
  text-align: left;
  position: relative;
  touch-action: pan-y;
  box-shadow: 0 1px 1.5px rgba(0,0,0,.22);
}
.b::after {
  content: "";
  display: table;
  clear: both;
}
.b.me {
  background: var(--meb, #0d3b66);
  color: #fff;
}
.b.me.first {
  border-top-right-radius: 4px;
}
.b.th.first {
  border-top-left-radius: 4px;
}
:root[data-theme=light] .b {
  background: #fff;
}
:root[data-theme=light] .b.me {
  background: var(--meb, #2f6fb5);
  color: #fff;
}
:root[data-theme=light] .b.th {
  background: #fff;
  color: #161a2b;
}
.b.gone {
  color: var(--muted);
}
.b img {
  display: block;
  max-width: 100%;
  max-height: 320px;
  object-fit: cover;
  border-radius: 12px;
  margin: 2px 0;
}
.b.pic {
  padding: 3px;
  width: min(72%, 280px);
}
.b.pic img {
  width: 100%;
  max-width: none;
  max-height: 360px;
  object-fit: cover;
  border-radius: 12px;
  margin: 0;
}
.b.pic .meta {
  padding: 2px 6px 1px;
}
.b.pic .who {
  padding: 2px 6px 0;
}

/* Sender Name in Groups - Strictly Above Message Text */
.who {
  display: block;
  width: 100%;
  font-weight: 600;
  font-size: 13px;
  line-height: 1.25;
  color: #8ec5ff;
  margin-bottom: 2px;
}
:root[data-theme=light] .who {
  color: #1d6fd6;
}
.bbody {
  display: block;
  width: 100%;
}
.btxt {
  display: inline;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: normal;
}
.btxt a.lnk {
  color: #7fd0ff;
  text-decoration: underline;
  text-underline-offset: 2px;
  word-break: break-all;
}
:root[data-theme=light] .b.th .btxt a.lnk {
  color: #1d6fd6;
}

/* Forwarded Label & Rich PDF/Document Attachment Cards */
.fwtag {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-style: italic;
  color: rgba(255,255,255,.72);
  margin-bottom: 4px;
}
:root[data-theme=light] .b.th .fwtag {
  color: var(--muted);
}
.doc {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  margin: 2px 0 4px;
  border-radius: 10px;
  background: rgba(7, 24, 44, .45);
  min-width: 225px;
  max-width: 100%;
  cursor: pointer;
}
:root[data-theme=light] .b.th .doc {
  background: rgba(0,0,0,.06);
}
.doc-ic {
  width: 36px;
  height: 42px;
  border-radius: 6px;
  background: #e53935;
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  display: grid;
  place-items: center;
  flex: none;
  letter-spacing: .3px;

}
.doc-info {
  min-width: 0;
  flex: 1;
  display: grid;
  gap: 2px;
}
.doc-info b {
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}
.doc-info small {
  font-size: 12px;
  color: rgba(255,255,255,.68);
}
:root[data-theme=light] .b.th .doc-info small {
  color: var(--muted);
}
.fwbtn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(24, 34, 41, .85);
  color: #e9edef;
  display: grid;
  place-items: center;
  flex: none;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
}
.fwbtn:active {
  transform: scale(.92);
}

/* Inline Floating Timestamp */
.meta {
  float: right;
  display: inline-flex;
  gap: 4px;
  align-items: center;
  font-size: 11px;
  color: var(--muted);
  margin: 4px -2px -2px 10px;
  white-space: nowrap;
  position: relative;
  z-index: 1;
  line-height: 1;
}
.b.me .meta {
  color: rgba(255,255,255,.78);
}
:root[data-theme=light] .b.me .meta {
  color: rgba(255,255,255,.8);
}
.b.me .tick {
  color: rgba(255, 255, 255, .68);
}
.b.me .tick.r {
  color: #53bdeb;
}
.del {
  display: none;
  color: #ffb3c0;
  font-size: 12px;
}
.b:hover .del, .b.sel .del {
  display: inline;
}

/* WhatsApp Floating Date Pills */
.day {
  text-align: center;
  margin: 10px auto;
  padding: 4px 12px;
  border-radius: 8px;
  background: #182229;
  color: #8696a0;
  font-size: 12.5px;
  font-weight: 500;
  width: fit-content;
  box-shadow: 0 1px 2px rgba(0,0,0,.25);
}
:root[data-theme=light] .day {
  background: #e1ebf5;
  color: #4b5a6c;
}

/* WhatsApp Bottom Composer Bar */
.conv-spacer {
  flex: 1 1 auto;
  min-height: 0;
  pointer-events: none;
}
.comp {
  flex: 0 0 auto;
  display: flex;
  gap: 6px;
  align-items: flex-end;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: transparent;
  width: 100%;
}
.comp.tray-open,
.app.kb .comp {
  padding-bottom: 6px;
}
.comp .box {
  flex: 1;
  display: flex;
  align-items: flex-end;
  background: rgba(31, 44, 52, .86);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, .08);
  border-radius: 25px;
  padding: 2px 4px;
  min-width: 0;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .24);
}
:root[data-theme=light] .comp .box {
  background: rgba(255, 255, 255, .9);
  border-color: rgba(22, 26, 43, .08);
  box-shadow: 0 6px 18px rgba(22, 26, 43, .1);
}
.comp textarea {
  flex: 1;
  resize: none;
  max-height: 120px;
  padding: 10px 4px;
  background: none;
  border: 0;
  outline: 0;
  min-width: 0;
  min-height: 42px;
  line-height: 22px;
  font-size: 16px;
  margin: 0;
}
.comp textarea::placeholder {
  color: var(--muted);
}
.comp .ib {
  width: 38px;
  height: 42px;
  flex: none;
  color: var(--muted);
}
.comp .ib.on {
  color: var(--accent);
}
.send {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #007bfc;
  color: #fff;
  display: grid;
  place-items: center;
  flex: none;
  box-shadow: 0 2px 6px rgba(0,0,0,.3);
}
.send.rec {
  background: #ff5d6c;
  animation: rp 1s infinite;
}

/* Auth / Login Screen - Keyboard-Safe Flex Sequence */
.auth {
  position: relative;
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(16px + env(safe-area-inset-bottom, 0px));
  gap: 14px;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#authart {
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, #040814, #0a1330 70%, #101b45);
}
.auth:focus-within .art *,
.auth:focus-within #authart * {
  animation-play-state: paused !important;
}
.auth .card {
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  width: 100%;
  max-width: 368px;
  margin: auto 0;
  display: grid;
  gap: 10px;
  background: linear-gradient(165deg, rgba(18, 25, 46, .96), rgba(12, 18, 34, .98));
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 28px;
  padding: 24px 22px 20px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 24px 60px rgba(0,0,0,.45);
  animation: cardin .45s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes cardin {
  from { opacity: 0; transform: translateY(12px) scale(.98); }
}
.card > * {
  animation: rise .5s cubic-bezier(.2,.8,.2,1) backwards;
}
.card > *:nth-child(2) { animation-delay: .04s; }
.card > *:nth-child(3) { animation-delay: .08s; }
.card > *:nth-child(4) { animation-delay: .12s; }
.card > *:nth-child(5) { animation-delay: .16s; }
.card > *:nth-child(6) { animation-delay: .2s; }
.card > *:nth-child(7) { animation-delay: .24s; }
.card > *:nth-child(8) { animation-delay: .28s; }
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
}
.card.shake {
  animation: shake .4s;
}
@keyframes shake {
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}
.card h1 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 32px;
}
.afold {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  width: 100%;
  min-width: 0;
  margin-bottom: -10px;
  transition: grid-template-rows .32s cubic-bezier(.2,.8,.2,1), opacity .22s, margin .32s cubic-bezier(.2,.8,.2,1);
}
.afold.open {
  grid-template-rows: 1fr;
  opacity: 1;
  margin-bottom: 0;
}
.afi {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  min-width: 0;
  min-height: 0;
  padding: 0;
  margin: 0;
}
.afi > * {
  flex: none;
}
.card .field, .card .atf {
  width: 100%;
  min-width: 0;
  height: 50px;
  padding: 0 16px;
  font-size: 16px;
  transition: border-color .18s, box-shadow .18s;
}
.card .field:focus, .card .atf:focus-within {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.atf {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--muted);
}
.atf input {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  padding: 0;
  height: 100%;
  color: var(--text);
  font-size: 16px;
}
.ust {
  display: block;
  min-height: 18px;
  text-align: center;
  color: #9fb0cf;
  line-height: 1.35;
}
.afi .ust {
  transition: margin .25s ease, min-height .25s ease, opacity .25s ease;
}
.afi .ust:empty {
  min-height: 0;
  height: 0;
  margin-top: -10px;
  opacity: 0;
}
.ust.good {
  color: #5ee6a8;
}
.ust.bad {
  color: #ff8a9a;
}
.pwf {
  position: relative;
  width: 100%;
}
.pwf .field {
  padding-right: 68px;
}
.pwt {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  padding: 8px 12px;
  border-radius: 12px;
  color: var(--muted);
  font-size: 13px;
}
.btn {
  position: relative;
  padding: 13px;
  border-radius: 16px;
  background: var(--grad);
  color: #fff;
  width: 100%;
  font-weight: 500;
}
.card .btn {
  height: 50px;
  padding: 0;
  transition: transform .15s ease, box-shadow .2s ease, filter .2s ease, background-color .2s;
}
.card .btn:not(.alt) {
  box-shadow: 0 8px 22px rgba(29,95,174,.35);
}
.card .btn:not(.alt):hover {
  transform: translateY(-1px);
  filter: brightness(1.08);
}
.card .btn:active {
  transform: scale(.985);
}
.btn.alt {
  background: var(--field);
  color: var(--text);
}
.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.btn.busy {
  color: transparent !important;
}
.btn.busy svg {
  opacity: 0;
}
.btn.busy::after {
  content: "";
  position: absolute;
  inset: 0;
  margin: auto;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  animation: spin .7s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.or {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #7f8db0;
  font-size: 13px;
}
.or::before, .or::after {
  content: "";
  height: 1px;
  flex: 1;
  background: rgba(255,255,255,.1);
}
#google {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.link {
  color: var(--muted);
  text-decoration: underline;
}
.card .link {
  padding: 6px 0;
}
.tag {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
  margin: 0;
}
.foot {
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  margin: 0;
  padding: 0;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  letter-spacing: .3px;
}
.foot a {
  display: inline-block;
  padding: 6px 14px;
  font-family: 'Space Grotesk', 'Outfit', system-ui, sans-serif;
  font-weight: 500;
  letter-spacing: .4px;
  color: #9fb0cf;
  text-decoration: none;
}
.foot a:hover {
  color: var(--accent);
}
.auth .tag, .auth .link {
  color: #9fb0cf;
}
@media (max-height: 700px) {
  .auth { padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; gap: 8px; }
  .auth .card { padding: 18px 18px 14px; gap: 8px; }
  .card h1 { font-size: 26px; margin-bottom: 4px; }
  .card .field, .card .atf, .card .btn { height: 46px; }
}

/* Modals, Sheets & Stories */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: grid;
  align-items: end;
  justify-items: center;
  z-index: 9;
  animation: mfade .2s ease both;
}
.sheet {
  width: 100%;
  max-width: 560px;
  max-height: 88dvh;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 18px 0 calc(20px + env(safe-area-inset-bottom, 0px));
  border-radius: 26px 26px 0 0;
  background: var(--panel);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-y;
  animation: sup .26s cubic-bezier(.2,.8,.2,1) both;
  box-shadow: 0 -10px 40px rgba(0,0,0,.35);
}
.sheet > * {
  flex: 0 0 auto;
}
.sheet::before {
  content: "";
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--line);
  margin: -8px auto 2px;
  flex: none;
}
.sheet > b, .sheet > .field, .sheet > .pill, .sheet > .seg, .sheet > .opt, .sheet > small, .sheet > .btn, .sheet > .wp, .sheet > .prev, .sheet > .th-h, .sheet > .ginfo, .sheet > .emo {
  margin: 0 18px;
  width: auto;
}
.th-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ginfo {
  display: grid;
  justify-items: center;
  gap: 6px;
  text-align: center;
}
.gname {
  font-size: 20px;
  font-weight: 600;
}
.emo {
  display: flex;
  justify-content: space-between;
}
.emo button {
  font-size: 26px;
  padding: 6px;
  border-radius: 12px;
}
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: 16px;
  background: var(--field);
}
.seg button {
  padding: 9px;
  border-radius: 12px;
  color: var(--muted);
}
.seg button.on {
  background: var(--chip);
  color: var(--accent);
}
.opt {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
}
.sw {
  width: 48px;
  height: 28px;
  border-radius: 14px;
  background: var(--field);
  position: relative;
  flex: none;
}
.sw::after {
  content: "";
  position: absolute;
  left: 3px;
  top: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s cubic-bezier(.22, 1.4, .36, 1);
}
.sw[aria-checked=true] {
  background: #2f84e0;
}
.sw[aria-checked=true]::after {
  transform: translateX(20px);
}
#toast {
  position: fixed;
  left: 50%;
  top: calc(70px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  padding: 10px 18px;
  border-radius: 99px;
  z-index: 12;
  white-space: nowrap;
  background: var(--panel);
  border: 1px solid var(--line);
  animation: mfade .2s ease both;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
@keyframes mfade {
  from { opacity: 0; }
}
@keyframes sup {
  from { transform: translateY(28px); opacity: 0; }
}

/* Background Cosmic Art */
.art {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
  background: var(--wall, linear-gradient(180deg, #040814, #0a1330 70%, #101b45));
}
.art.a-none {
  display: none;
}
.art .st {
  position: absolute;
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: #fff;
  opacity: .2;
  animation: tw var(--d) ease-in-out var(--o) infinite;
}
@keyframes tw {
  50% { opacity: .95; transform: scale(1.5); }
}
.art .sh {
  position: absolute;
  width: 120px;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(270deg, rgba(255,255,255,0), #fff);
  opacity: 0;
  animation: sh var(--d) linear var(--o) infinite;
}
@keyframes sh {
  0% { opacity: 0; transform: translate(0,0) rotate(-35deg); }
  2% { opacity: 1; }
  12%, 100% { opacity: 0; transform: translate(-340px, 240px) rotate(-35deg); }
}
.art .pl {
  position: absolute;
  border-radius: 50%;
  animation: fl 16s ease-in-out infinite alternate;
}
@keyframes fl {
  to { transform: translate(-18px, 24px); }
}
.p1 {
  width: 84px;
  height: 84px;
  right: -8px;
  top: 12%;
  background: radial-gradient(circle at 32% 30%, #ffd9a0, #e58a3c 55%, #7a3a12);
  box-shadow: inset -10px -8px 18px rgba(0,0,0,.45), 0 0 30px rgba(255,160,70,.22);
}
.p2 {
  width: 46px;
  height: 46px;
  left: 8%;
  top: 60%;
  background: radial-gradient(circle at 30% 30%, #bfe4ff, #4d8fd6 60%, #1a3a6e);
  box-shadow: inset -6px -5px 12px rgba(0,0,0,.5);
  animation-duration: 13s;
  animation-delay: -4s;
}
.p3 {
  width: 110px;
  height: 110px;
  left: 52%;
  top: 74%;
  background: radial-gradient(circle at 30% 30%, #e3c9ff, #8c5ad8 58%, #3a1a6e);
  box-shadow: inset -10px -8px 20px rgba(0,0,0,.5);
  animation-duration: 19s;
  animation-delay: -8s;
}
.p3::after {
  content: "";
  position: absolute;
  left: -32%;
  right: -32%;
  top: 38%;
  height: 24%;
  border: 2px solid rgba(225,205,255,.5);
  border-radius: 50%;
  transform: rotate(-18deg);
}
.art .neb {
  position: absolute;
  width: 75%;
  height: 55%;
  border-radius: 50%;
  animation: fl 15s ease-in-out infinite alternate;
}
.n1 {
  left: -15%;
  top: 2%;
  background: radial-gradient(closest-side, rgba(110,80,255,.5), transparent);
}
.n2 {
  right: -20%;
  bottom: 0;
  background: radial-gradient(closest-side, rgba(30,200,170,.4), transparent);
  animation-delay: -6s;
}


/* Doodle wallpapers */
:root { --patc: #ffffff; }
:root[data-theme=light] { --patc: #2d3a5a; }
.pat {
  position: absolute;
  inset: 0;
  background: var(--pc, var(--patc));
  opacity: var(--po, .28);
  pointer-events: none;
  -webkit-mask-repeat: repeat;
  mask-repeat: repeat;
  -webkit-mask-size: 440px 440px;
  mask-size: 440px 440px;
}
.art.a-doodle {
  background: var(--wall, var(--bg));
}
.pgrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 6px;
}
.ptile {
  position: relative;
  height: 74px;
  border-radius: 16px;
  overflow: hidden;
  border: 2px solid var(--line);
  background: var(--field);
  color: var(--text);
  font: 500 12.5px/1 'Outfit', system-ui, sans-serif;
  display: flex;
  align-items: flex-end;

.art.a-holo {
  background: linear-gradient(125deg, #f7a9d9, #a9c9ff 22%, #c9f7e1 42%, #e9c9ff 62%, #ffd9a9 82%, #f7a9d9);
  background-size: 300% 300%;
  animation: holo 14s ease-in-out infinite;
}
.art.a-holo::after {
  content: "";
  position: absolute;
  inset: -20%;
  background: radial-gradient(40% 30% at 30% 30%, rgba(255,255,255,.55), transparent), radial-gradient(35% 28% at 75% 70%, rgba(255,255,255,.4), transparent);
  animation: fl 9s ease-in-out infinite alternate;
}
@keyframes holo { 50% { background-position: 100% 100%; } }
.art.a-sky {
  background: linear-gradient(180deg, #3f6fe8, #86b4ff 42%, #cfe3ff 68%, #e6efc8);
}
.art.a-sky::before, .art.a-sky::after {
  content: "";
  position: absolute;
  left: -30%;
  width: 90%;
  height: 22%;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.75), transparent);
  filter: blur(6px);
  animation: drift 26s linear infinite;
}
.art.a-sky::before { top: 24%; }
.art.a-sky::after { top: 58%; width: 110%; animation-duration: 34s; animation-delay: -12s; opacity: .8; }
@keyframes drift { to { transform: translateX(130%); } }
.art.a-aurora {
  background: linear-gradient(180deg, #03171c, #06303a 40%, #0b1b3c 70%, #1c0f3a);
}
.art.a-aurora::before, .art.a-aurora::after {
  content: "";
  position: absolute;
  inset: -10% -20% 30% -20%;
  background: repeating-linear-gradient(95deg, transparent 0 7%, rgba(60,230,170,.38) 11%, transparent 17% 24%);
  filter: blur(14px);
  animation: aur 12s ease-in-out infinite alternate;
  mask-image: linear-gradient(180deg, transparent, #000 35%, transparent);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 35%, transparent);
}
.art.a-aurora::after {
  background: repeating-linear-gradient(80deg, transparent 0 9%, rgba(150,110,255,.34) 13%, transparent 19% 27%);
  animation-duration: 17s;
  animation-direction: alternate-reverse;
}
@keyframes aur { from { transform: translateX(-6%) skewX(-6deg); opacity: .6; } to { transform: translateX(6%) skewX(6deg); opacity: 1; } }

  pop: 7,

  receive: 6,

const avTap = (node, fn, label) => {
  node.classList.add('av-tap');
  node.setAttribute('role', 'button');
  node.setAttribute('tabindex', '0');
  if (label) node.setAttribute('aria-label', label);
  const goTap = e => {
    e.stopPropagation();
    e.preventDefault();
    haptic('tap');
    fn();
  };
  node.addEventListener('click', goTap);
  node.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') goTap(e);
  });
  return node;
};

/* Horizontal Touch Swipe Navigation Between Main Tabs */
(() => {
  const v = $('#view');
  const ORDER = ['chats', 'friends', 'comm', 'profile'];
  let x0 = 0, y0 = 0, dx = 0, active = false, locked = false, crossed = false;

  const reset = animate => {
    v.style.transition = animate ? 'transform .22s cubic-bezier(.22,.85,.32,1), opacity .22s ease' : 'none';
    v.style.transform = '';
    v.style.opacity = '';
    active = false;
    locked = false;
    crossed = false;
  };

  v.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || cur !== null || $('#q').value.trim() || document.querySelector('.modal')) return;
    if (e.target.closest('.tray, .sw-row, input, textarea, [data-noswipe]')) return;
    const t = e.touches[0];
    x0 = t.clientX;
    y0 = t.clientY;
    dx = 0;
    active = false;
    locked = false;
    crossed = false;
    v.style.transition = 'none';
  }, { passive: true });

  v.addEventListener('touchmove', e => {
    if (locked || cur !== null || $('#q').value.trim() || !x0) return;
    const t = e.touches[0];
    const mx = t.clientX - x0;
    const my = t.clientY - y0;

    if (!active) {
      if (Math.abs(my) > Math.abs(mx) && Math.abs(my) > 10) {
        locked = true;
        return;
      }
      if (Math.abs(mx) > 14 && Math.abs(mx) > Math.abs(my) * 1.35) {
        active = true;
      } else {
        return;
      }
    }

    const idx = ORDER.indexOf(tab);
    const atStart = idx <= 0 && mx > 0;
    const atEnd = idx >= ORDER.length - 1 && mx < 0;
    const damp = (atStart || atEnd) ? 0.25 : 0.72;
    dx = Math.max(-130, Math.min(130, mx * damp));
    v.style.transform = 'translateX(' + dx.toFixed(1) + 'px)';
    if (!atStart && !atEnd) {
      v.style.opacity = String(Math.max(0.68, 1 - Math.abs(dx) / 360));
      const nowCrossed = Math.abs(dx) >= 48;
      if (nowCrossed && !crossed) {
        crossed = true;
        const targetTab = ORDER[idx + (dx < 0 ? 1 : -1)];
        const tabEl = document.querySelector('.tab[data-k="' + targetTab + '"] .tp');
        haptic('detent', tabEl);
      } else if (!nowCrossed && crossed) {
        crossed = false;
      }
    }
  }, { passive: true });

  const endSwipe = () => {
    if (!x0) return;
    const wasActive = active, finalDx = dx;
    x0 = y0 = dx = 0;
    if (!wasActive) {
      active = false;
      locked = false;
      crossed = false;
      return;
    }
    const idx = ORDER.indexOf(tab);
    const threshold = 48;
    if (finalDx < -threshold && idx < ORDER.length - 1) {
      reset(false);
      go(ORDER[idx + 1], 'l', true);
    } else if (finalDx > threshold && idx > 0) {
      reset(false);
      go(ORDER[idx - 1], 'r', true);
    } else {
      reset(true);
    }
  };

  v.addEventListener('touchend', endSwipe, { passive: true });
  v.addEventListener('touchcancel', () => {
    x0 = y0 = dx = 0;
    reset(true);
  }, { passive: true });
})();

const emoParse = () => EMJ_P || (EMJ_P = EMJ.map(([k, l, t]) => ({ k, l, items: t.split('\n').map(line => { const i = line.indexOf(' '); let e = line.slice(0, i), m = 0; if (e.endsWith('*')) { e = e.slice(0, -1); m = 1; } return { e, m, n: line.slice(i + 1) }; }) })));
const EMJ_TONES = ['', '\u{1F3FB}', '\u{1F3FC}', '\u{1F3FD}', '\u{1F3FE}', '\u{1F3FF}'];
let EMJ_TONE = 0, EMJ_RECENT = [];
try { EMJ_TONE = +localStorage.getItem('emo_tone') || 0; EMJ_RECENT = JSON.parse(localStorage.getItem('emo_recent') || '[]'); } catch (e) {}
const emjTone = (e, m) => {
  if (!m || !EMJ_TONE) return e;
  const cps = [...e], f = cps.shift();
  if (cps[0] === '\uFE0F') cps.shift();
  return f + EMJ_TONES[EMJ_TONE] + cps.join('');
};
function insertEmoji(e) {
  const t = $('#txt'), s = t.selectionStart == null ? t.value.length : t.selectionStart, en = t.selectionEnd == null ? s : t.selectionEnd;
  t.value = t.value.slice(0, s) + e + t.value.slice(en);
  try { t.setSelectionRange(s + e.length, s + e.length); } catch (x) {}
  t.dispatchEvent(new Event('input', { bubbles: true }));
  EMJ_RECENT = [e, ...EMJ_RECENT.filter(x => x !== e)].slice(0, 32);
  try { localStorage.setItem('emo_recent', JSON.stringify(EMJ_RECENT)); } catch (x) {}
}

/* Inline Emoji & Sticker Drawer inside the Message Panel */
let EM_OPEN = false, EM_MODE = 'emoji', EM_CACHE = null, EM_CACHE_KEY = '';
function syncPaneInsets() {
  const box = $('#msgs');
  if (!box) return;
  const topBars = [$('.chead'), $('#csbar'), $('#pinbar')].filter(x => x && !x.hidden);
  const topH = topBars.reduce((acc, el) => acc + el.offsetHeight, 0);
  const botBars = [$('#rbar'), $('#mpop'), $('#comp'), $('#emtray'), $('#annote')].filter(x => x && !x.hidden);
  const botH = botBars.reduce((acc, el) => acc + el.offsetHeight, 0);
  if (topH) box.style.paddingTop = (topH + 8) + 'px';
  if (botH) box.style.paddingBottom = (botH + 8) + 'px';

function closeEmojiTray() {

function openEmojiTray(tab) {
  const nextMode = tab === 'stk' ? 'stk' : 'emoji';
  if (EM_OPEN && EM_MODE === nextMode && !tab) {
    closeEmojiTray();
    return;

function buildEmojiBody(toneBtn) {
  const key = EMJ_TONE + '|' + EMJ_RECENT.join('');
  if (EM_CACHE && EM_CACHE_KEY === key) return EM_CACHE;
  const cats = emoParse();
  const body = el('div', { class: 'emx' });
  const bar = el('div', { class: 'emcats' });
  const grid = el('div', { class: 'emgrid' });
  const secs = [];
  let lockSpy = false;

  grid.onclick = ev => {
    const b = ev.target.closest('button[data-e]');
    if (b) {
      haptic('tap');
      insertEmoji(b.dataset.e);
    }
  };

  const setActive = k => {
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  };

  const list = [];
  if (EMJ_RECENT.length) list.push({ k: 'recent', l: 'Recent', icon: '\u{1F552}', rows: EMJ_RECENT.map(e => [e, 'Recent']) });
  for (const c of cats) list.push({ k: c.k, l: c.l, icon: EMJ_ICON[c.k], rows: c.items.map(it => [emjTone(it.e, it.m), it.n]) });

  const frag = document.createDocumentFragment();
  const barFrag = document.createDocumentFragment();
  for (const s of list) {
    const h = el('h4', {}, s.l);
    const r = el('div', { class: 'emrow' });
    for (const [e, n] of s.rows) {
      const btn = document.createElement('button');
      btn.dataset.e = e;
      btn.title = n;
      btn.setAttribute('aria-label', n);
      btn.textContent = e;
      r.appendChild(btn);
    }
    const w = el('section', {}, h, r);
    frag.appendChild(w);
    secs.push([s.k, w]);

    const cb = document.createElement('button');
    cb.dataset.k = s.k;
    cb.setAttribute('aria-label', s.l);
    cb.textContent = s.icon;
    cb.onclick = () => {
      haptic('tap');
      lockSpy = true;
      setActive(s.k);
      grid.scrollTop = w.offsetTop;
      requestAnimationFrame(() => { lockSpy = false; });
    };
    barFrag.appendChild(cb);
  }
  grid.appendChild(frag);
  bar.appendChild(barFrag);

  let tick = 0;
  grid.onscroll = () => {
    if (lockSpy) return;
    if (!tick) tick = requestAnimationFrame(() => {
      tick = 0;
      let on = secs.length ? secs[0][0] : '';
      const st = grid.scrollTop + 24;
      for (const [k, w] of secs) if (w.offsetTop <= st) on = k;
      setActive(on);
    });
  };

  if (secs.length) setActive(secs[0][0]);
  body.append(bar, grid);
  EM_CACHE = body;
  EM_CACHE_KEY = key;
  return body;
}

function framer(file, done) {
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const SZ = 260, min = Math.max(SZ / im.width, SZ / im.height);
    let sc = min, x = (SZ - im.width * sc) / 2, y = (SZ - im.height * sc) / 2;
    const img = el('img', { src: url, alt: '', draggable: 'false' });
    const place = () => {
      x = Math.min(0, Math.max(SZ - im.width * sc, x));
      y = Math.min(0, Math.max(SZ - im.height * sc, y));
      img.style.width = im.width * sc + 'px';
      img.style.height = im.height * sc + 'px';
      img.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    };
    const box = el('div', { class: 'frame' }, img);
    place();
    let drag = null;
    box.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY }; box.setPointerCapture(e.pointerId); };
    box.onpointermove = e => { if (!drag) return; x += e.clientX - drag.x; y += e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY }; place(); };
    box.onpointerup = box.onpointercancel = () => { drag = null; };
    const z = el('input', { class: 'zoom', type: 'range', min: '1', max: '3', step: '0.01', value: '1', 'aria-label': 'Zoom' });
    z.oninput = () => {
      const cx = (SZ / 2 - x) / sc, cy = (SZ / 2 - y) / sc;
      sc = min * (+z.value);
      x = SZ / 2 - cx * sc;
      y = SZ / 2 - cy * sc;
      place();
    };
    sheet(
      el('b', {}, 'Frame your photo'),
      box,
      el('small', { style: 'text-align:center' }, 'Drag to move, use the slider to zoom'),
      z,
      el('div', { class: 'wp ac2' },
        btn('Save photo', () => {
          const c = document.createElement('canvas');
          c.width = c.height = 512;
          c.getContext('2d').drawImage(im, -x / sc, -y / sc, SZ / sc, SZ / sc, 0, 0, 512, 512);
          closeSheet(() => done(c.toDataURL('image/jpeg', .88)));
        }),
        btn('Cancel', () => closeSheet(), 1)
      )
    );
  };
  im.src = url;
}

const dayLbl = t => {
  const d = new Date(t), n = new Date();
  const df = Math.floor((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  return df <= 0 ? 'Today' : df === 1 ? 'Yesterday' : df < 7 ? d.toLocaleDateString([], { weekday: 'long' }) : d.toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' });
};

function msgs(force) {
  syncAct();
  if (force && cur != null) {
    const c0 = find(cur);
    if (c0) { c0.nm = 0; jb.dataset.n = ''; }
  }
  const c = find(cur), box = $('#msgs'), near = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  box.replaceChildren();
  c.msgs.sort((a, b) => a.t - b.t);
  const lst = c.msgs;
  let lastDay = '', prevF = null;
  for (const [i, m] of lst.entries()) {
    const dl = dayLbl(m.t);
    if (dl !== lastDay) {
      lastDay = dl;
      prevF = null;
      box.append(el('div', { class: 'day' }, dl));
    }
    if (m.f === 'sys') {
      prevF = null;
      box.append(el('div', { class: 'day' }, m.b));
      continue;
    }
    const me = m.f === 'me', seq = prevF === m.f, first = !seq;
    prevF = m.f;
    const b = el('div', { class: 'b ' + (me ? 'me' : 'th') + (first ? ' first' : '') + (m.del ? ' gone' : '') + ((m.img || m.imgs) && !m.b && !m.del && !m.once ? ' pic' : '') + (m.stk && !m.del ? ' stkb' : '') + (m.id === c.fresh ? ' bin' : '') });
    if (c.g && !me && first) {
      b.append(el('div', { class: 'who', style: 'color:hsl(' + hue(U[m.f].n) + ' 80% 72%);cursor:pointer', onclick: e => { e.stopPropagation(); haptic('tap'); userProfileSheet(m.f); } }, U[m.f].n));
    }
    const meta = el('span', { class: 'meta' });
    meta.append(m.st ? '★ ' : '', m.ed ? 'edited ' : '', tm(m.t));
    if (me) meta.append(el('span', { class: 'tick' + (m.read && ST.receipts ? ' r' : '') }, tickIcon(!!(m.read && ST.receipts))));

    const body = el('div', { class: 'bbody' });
    if (m.del) {
      body.append(el('i', { class: 'btxt' }, m.del === 'admin' ? 'Deleted by admin' : 'This message was deleted'), meta);
    } else {
      if (m.fw) body.append(el('div', { class: 'fwtag' }, ic('fw', 14), 'Forwarded'));
      if (m.re) body.append(el('div', { class: 'quote' }, el('b', {}, m.re.who), el('span', {}, m.re.text)));
      if (m.stk) {
        const cnt = [...m.stk.replace(/[\uFE00-\uFE0F\u200D]/g, '').trim()].length;
        body.append(el('span', { class: 'stk' + (cnt === 2 ? ' s2' : cnt >= 3 ? ' s3' : '') }, m.stk));
      }
      if (m.doc) body.append(docEl(m));
      if (m.once) body.append(onceEl(c, m));
      else if (m.imgs) body.append(albumEl(m));
      else if (m.img) body.append(el('img', { src: m.img === 1 ? pic : m.img, alt: 'Shared photo' }));
      if (m.au) body.append(el('audio', { controls: true, src: m.au, class: 'vm' }));
      if (m.poll) body.append(pollEl(c, m));
      if (m.ev) body.append(evEl(m));
      if (m.b) body.append(el('span', { class: 'btxt' }, ...richNodes(m.b)));
      body.append(meta);
    }
    b.append(body);
    if (m.rx && Object.keys(m.rx).length && !m.del) b.append(rxRow(m));
    if (!m.del) {
      let t;
      b.oncontextmenu = e => { e.preventDefault(); haptic('heavy'); msgMenu(c, m); };
      b.addEventListener('touchstart', () => {
        t = setTimeout(() => {
          b._lp = 1;
          haptic('heavy');
          msgMenu(c, m);
        }, 480);
      }, { passive: true });
      ['touchend', 'touchmove', 'touchcancel'].forEach(ev => b.addEventListener(ev, () => clearTimeout(t), { passive: true }));
      b.addEventListener('click', e => {
        if (b._lp) {
          b._lp = 0;
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    }
    const hasQuickFw = !m.del && (m.doc || m.img || m.imgs);

  }

const REP = ['Nice, got it', 'Haha, love it', 'On my way', 'Let’s do it', 'Sounds great'];
const isPureEmoji = str => {
  if (!str) return false;
  // Strip variation selectors / zero-width joiners
  const clean = str.replace(/[\uFE00-\uFE0F\u200D]/g, '').trim();
  if (!clean || [...clean].length > 3) return false;
  // Emoji regex range test
  const emojiRegex = /^(?:[\u{1F300}-\u{1F5FF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]|[\u{1F700}-\u{1F77F}]|[\u{1F780}-\u{1F7FF}]|[\u{1F800}-\u{1F8FF}]|[\u{1F900}-\u{1F9FF}]|[\u{1FA00}-\u{1FA6F}]|[\u{1FA70}-\u{1FAFF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]|[\u{1F1E6}-\u{1F1FF}])+/u;
  // Check if every character in clean is an emoji
  const chars = [...clean];
  return chars.every(ch => emojiRegex.test(ch) || /^[\u231a-\u231b\u23e9-\u23ec\u23f3\u25aa-\u25ab\u25b6\u25c0\u25fb-\u25fe\u2600-\u27ef\u2b05-\u2b07\u2b1b-\u2b1c\u2b50\u2b55\u3030\u303d\u3297\u3299]+$/u.test(ch));
};

function send(extra = {}) {
  const c = find(cur);
  let b = $('#txt').value.trim();
  if (!b && !extra.img && !extra.au && !extra.poll && !extra.ev && !extra.imgs && !extra.stk && !extra.doc) return;
  if (b && !extra.stk && isPureEmoji(b)) {
    extra = { ...extra, stk: b };
    b = '';
  }
  if (EDIT && b) {
    EDIT.b = b;
    EDIT.ed = 1;
    EDIT = null;
    clearBar();
    $('#txt').value = '';
    c.draft = '';
    haptic('success');
    msgs();
    return;
  }
  if (REPLY) {
    extra = { ...extra, re: REPLY };
    REPLY = null;
    clearBar();
  }
  if (c.dis) extra = { ...extra, exp: Date.now() + c.dis };
  c.draft = '';
  const keep = document.activeElement === $('#txt');
  $('#txt').value = '';
  $('#txt').style.height = 'auto';
  c.msgs.push(mk('me', b || null, 0, extra));
  haptic('send');
  msgs(true);
  if (keep) $('#txt').focus({ preventScroll: true });
  if (!c.m.length || c.self) return;
  const who = c.m[Math.floor(Math.random() * c.m.length)], id = c.id;
  setTimeout(() => { if (cur === id) { typer = U[who].n; head(); } }, 700);
  setTimeout(() => {
    typer = '';
    c.msgs.forEach(m => m.f === 'me' && (m.read = true));
    c.msgs.push(mk(who, REP[Math.floor(Math.random() * REP.length)], 0));
    if (cur === id) { head(); incoming(c); }
    else { c.unread++; haptic('receive'); }
  }, 2600);
}

function shrink(f, max, cb) {
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height));
    const c = document.createElement('canvas');
    c.width = Math.round(im.width * k);
    c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(im.src);
    cb(c.toDataURL('image/jpeg', .72));
  };
  im.src = URL.createObjectURL(f);
}

    clearOverrides();
    Object.assign(PR, v);
  }
  applyPrefs();
  refreshArt();
}

/* Auth & Fast Lag-Free Input Handling */
let mode = 'in';
$('#toggle').onclick = () => {
  haptic('soft');
  mode = mode === 'in' ? 'up' : 'in';
  $('#afold').classList.toggle('open', mode === 'up');
  $('#afold').inert = mode === 'in';
  $('#afold2').classList.toggle('open', mode === 'up');
  $('#afold2').inert = mode === 'in';
  $('#pw2').value = '';
  pwCheck();
  $('#email').placeholder = mode === 'in' ? 'Your email or user ID' : 'Email';
  $('#pw').autocomplete = mode === 'in' ? 'current-password' : 'new-password';
  if (mode === 'up') {
    aCheck();
    $('#auth').scrollTo({ top: 0, behavior: 'smooth' });
  }
  $('#go').textContent = mode === 'in' ? 'Sign in' : 'Create account';
  $('#toggle').textContent = mode === 'in' ? 'New here? Create an account' : 'Have an account? Sign in';
};

const TAKEN = new Set(['admin', 'support', 'help', 'root', 'cosmic', 'cosmicchat', 'cosmic_you', 'maya', 'jamal', 'amara', 'leo', 'nova', 'zara', 'kai', 'ivy']);
const unOk = v => /^[a-z][a-z0-9_]{2,19}$/.test(v);
const unClean = v => v.trim().toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '');
const unSug = n => {
  const b = n.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 16);
  return !b ? '' : /^[a-z]/.test(b) ? b : 'u_' + b;
};

let AUOK = false, aut;
function aCheck() {
  const v = unClean($('#auser').value), st = $('#aust');
  AUOK = false;
  clearTimeout(aut);
  if (!v) {
    st.textContent = '';
    st.className = 'ust';
    return;
  }
  if (!unOk(v)) {
    st.textContent = 'Use 3 to 20 letters, numbers or underscores. Start with a letter.';
    st.className = 'ust bad';
    return;
  }
  st.textContent = 'Checking\u2026';
  st.className = 'ust';
  aut = setTimeout(() => {
    if (unClean($('#auser').value) !== v) return;
    if (TAKEN.has(v)) {
      st.textContent = '@' + v + ' is already taken.';
      st.className = 'ust bad';
    } else {
      st.textContent = '@' + v + ' is available.';
      st.className = 'ust good';
      AUOK = true;
    }
  }, 300);
}

$('#auser').oninput = e => {
  if (e.isComposing) return;
  $('#auser').dataset.t = 1;
  const cleaned = $('#auser').value.toLowerCase().replace(/[^a-z0-9_]/g, '');
  if ($('#auser').value !== cleaned) $('#auser').value = cleaned;
  aCheck();
};

$('#name').oninput = e => {
  if (e.isComposing) return;
  if (!$('#auser').dataset.t) {
    const sug = unSug($('#name').value);
    if ($('#auser').value !== sug) $('#auser').value = sug;
    aCheck();
  }
};

function afterAuth(kind) {
  const id = $('#email').value.trim();
  if (kind === 'old') {
    P.user = P.user || (id && !id.includes('@') ? unClean(id) : '') || 'cosmic_you';
    return enter();
  }
  if (kind === 'new') {
    P.user = unClean($('#auser').value);
    P.name = $('#name').value.trim() || P.user;
    P.google = false;
    P.email = id;
    P.userAt = 0;
    TAKEN.add(P.user);
    return enter();
  }
  P.name = 'Alex Morgan';
  P.google = true;
  P.user = null;
  P.userAt = 0;
  unameScreen(P.name, v => { P.user = v; TAKEN.add(v); enter(); });
}

function unameScreen(gname, done) {
  const old = $('#uname');
  if (old) old.remove();
  const sug = n => {
    const b = n.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 16) || 'cosmic';
    return /^[a-z]/.test(b) ? b : 'u_' + b;
  };
  const inp = el('input', { value: sug(gname), maxlength: '20', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', 'aria-label': 'Username' });
  const st = el('small', { class: 'ust' }), chips = el('div', { class: 'sw-row', style: 'justify-content:center' }), go = el('button', { class: 'btn' }, 'Continue');
  let ok = false, tm_;
  const alt = v => {
    const r = [];
    for (const x of ['2', '7', '_x', '_cosmic', '_01']) {
      const c = (v + x).slice(0, 20);
      if (unOk(c) && !TAKEN.has(c) && !r.includes(c)) r.push(c);
      if (r.length >= 3) break;
    }
    return r;
  };
  const check = () => {
    const v = unClean(inp.value);
    ok = false;
    go.disabled = true;
    chips.replaceChildren();
    clearTimeout(tm_);
    if (!v) { st.textContent = 'Pick a username so friends can find you.'; st.className = 'ust'; return; }
    if (!unOk(v)) { st.textContent = 'Use 3 to 20 letters, numbers or underscores. Start with a letter.'; st.className = 'ust bad'; return; }
    st.textContent = 'Checking\u2026';
    st.className = 'ust';
    tm_ = setTimeout(() => {
      if (unClean(inp.value) !== v) return;
      if (TAKEN.has(v)) {
        st.textContent = '@' + v + ' is already taken. Try one of these:';
        st.className = 'ust bad';
        chips.replaceChildren(...alt(v).map(a => el('button', { class: 'chip', onclick: () => { haptic('soft'); inp.value = a; check(); } }, '@' + a)));
      } else {
        st.textContent = '@' + v + ' is available.';
        st.className = 'ust good';
        ok = true;
        go.disabled = false;
      }
    }, 300);
  };
  inp.oninput = e => {
    if (e.isComposing) return;
    const cleaned = inp.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
    if (inp.value !== cleaned) inp.value = cleaned;
    check();
  };
  inp.onkeydown = e => { if (e.key === 'Enter' && ok) go.click(); };
  go.onclick = () => { if (!ok) return; haptic('success'); const v = unClean(inp.value); sec.remove(); done(v); };
  const back = el('button', { class: 'link', onclick: () => { haptic('soft'); sec.remove(); $('#auth').hidden = false; } }, 'Use a different account');
  const sec = el('section', { class: 'auth', id: 'uname' },
    el('div', { class: 'art a-shoot unart' }),
    el('div', { class: 'card' },
      el('h1', {}, 'Choose your username'),
      el('div', { style: 'display:grid;justify-items:center;gap:6px' }, av(gname, 0, 84), el('b', { class: 'unx' }, 'Welcome, ' + gname), el('small', { class: 'ust' }, P.google ? 'Signed in with Google' : 'Account created')),
      el('p', { class: 'unx', style: 'margin:0;text-align:center' }, 'Friends will find you by this name.'),
      el('div', { class: 'atf' }, el('span', {}, '@'), inp),
      st,
      chips,
      go,
      el('p', { class: 'tag' }, 'You can change it later in Profile, once every 14 days.'),
      back
    ),
    el('p', { class: 'foot' }, el('a', { href: 'https://cosmicpioneer.com', target: '_blank', rel: 'noopener noreferrer' }, 'CosmicPioneer.com'))
  );
  sec.querySelector('.art').replaceWith(art('shoot'));
  sec.querySelector('.art').classList.add('unart');
  $('#auth').hidden = true;
  document.body.append(sec);
  check();
  inp.focus();
}

const enter = () => {
  haptic('success');
  $('#auth').hidden = true;
  $('#app').hidden = false;
  if (location.hash) location.replace('#');
  render();
  fit();
  if (LOCK) showLock('unlock');
};

function signOut() {
  document.querySelectorAll('.modal').forEach(m => m.remove());
  $('#app').hidden = true;
  $('#auth').hidden = false;
  closeConv();
  if (location.hash) location.replace('#');
  if (mode === 'up') $('#toggle').click();
  $('#pw').value = '';
}

function submit(kind) {
  const go = $('#go'), g = $('#google');
  if (go.disabled) return;
  if (kind === 'new') {
    const bad = !$('#name').value.trim() ? 'Enter your name.'
      : !AUOK ? 'Choose an available username first.'
      : !$('#email').value.trim() ? 'Enter your email.'
      : !$('#pw').value ? 'Enter a password.'
      : $('#pw').value !== $('#pw2').value ? 'Passwords do not match.' : '';
    if (bad) {
      const c = $('#auth .card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
      haptic('warn');
      return toast(bad);
    }
  }
  haptic('tap');
  const b = kind === 'google' ? g : go;
  b.classList.add('busy');
  go.disabled = g.disabled = true;
  setTimeout(() => {
    b.classList.remove('busy');
    go.disabled = g.disabled = false;
    afterAuth(kind);
  }, kind === 'google' ? 550 : 450);
}

$('#go').onclick = () => submit(mode === 'up' ? 'new' : 'old');
$('#google').onclick = () => submit('google');
function pwCheck() {
  const a = $('#pw').value, b = $('#pw2').value, st = $('#pwst');
  if (!b) { st.textContent = ''; st.className = 'ust'; return; }
  const same = a === b;
  st.textContent = same ? 'Passwords match.' : 'Passwords do not match.';
  st.className = 'ust ' + (same ? 'good' : 'bad');
}
$('#pw').addEventListener('input', pwCheck);
$('#pw2').addEventListener('input', pwCheck);
$('#pwt').onclick = () => {
  haptic('soft');
  const p = $('#pw'), sh = p.type === 'password';
  p.type = $('#pw2').type = sh ? 'text' : 'password';
  $('#pwt').textContent = sh ? 'Hide' : 'Show';
  $('#pwt').setAttribute('aria-label', sh ? 'Hide password' : 'Show password');
};
$('#auth').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') $('#go').click();
});
$('#send').onpointerdown = e => e.preventDefault();

/* Mobile VisualViewport Sync - Keeps Auth & Chat Properly Aligned Above Keyboard */
const vv = window.visualViewport;
function revealAuthField(elTarget) {
  if (!elTarget || elTarget.tagName !== 'INPUT') return;
  const authBox = elTarget.closest('.auth');
  if (!authBox) return;
  if (elTarget.id === 'name') {
    authBox.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    elTarget.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}
function syncFit() {
  fit();
  requestAnimationFrame(fit);
  setTimeout(fit, 80);
  setTimeout(fit, 200);
  setTimeout(fit, 360);
}

document.addEventListener('focusin', e => {
  if (e.target && e.target.closest('.auth')) {
    setTimeout(() => revealAuthField(e.target), 120);
  }
  syncFit();
});
document.addEventListener('focusout', syncFit);

function fit() {
  const winH = window.innerHeight;
  const vvH = vv ? vv.height : winH;
  const vvTop = vv ? vv.offsetTop : 0;
  /* When interactive-widget=resizes-content resizes the layout viewport natively (Android Chrome/Brave),
     let CSS height: 100% fill exact space down to keyboard. Only override with vv.height when visualViewport
     is significantly smaller than window.innerHeight (e.g. iOS Safari). */
  const useVv = vv && (winH - vvH > 80);
  const hCss = useVv ? vvH + 'px' : '100%';
  const tfCss = (useVv && vvTop) ? 'translateY(' + vvTop + 'px)' : '';
  if (window.scrollY || window.scrollX) window.scrollTo(0, 0);

  const active = document.activeElement;
  const scrH = window.screen ? window.screen.height : winH;
  const effH = useVv ? vvH : winH;
  const kbOpen = !!(active && (active.tagName === 'TEXTAREA' || (active.tagName === 'INPUT' && !/^(file|checkbox|radio|range|button|submit)$/i.test(active.type)))) || effH < scrH * 0.72;

  document.querySelectorAll('.auth').forEach(authEl => {
    if (authEl.hidden) return;
    authEl.style.height = hCss;
    authEl.style.transform = tfCss;
  });

  if (active && active.closest('.auth')) {
    revealAuthField(active);
    return;
  }

  if ($('#app').hidden) return;
  const a = $('#app');
  a.classList.toggle('kb', kbOpen);
  a.style.height = hCss;
  a.style.transform = tfCss;
  if (cur !== null) {
    const p = $('#msgs');
    if (active === $('#txt') || p.scrollHeight - p.scrollTop - p.clientHeight < 220) {
      p.scrollTop = p.scrollHeight;
    }
  }
}
document.addEventListener('selectstart', e => {
  if (!e.target || (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
    e.preventDefault();
  }
});
document.addEventListener('contextmenu', e => {
  if (!e.target || (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
    e.preventDefault();
  }
});

if (vv) {
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
}
addEventListener('resize', fit);
fit();
